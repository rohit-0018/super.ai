services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qwai
      POSTGRES_PASSWORD: qwai
      POSTGRES_DB: qwai
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qwai:qwai@postgres:5432/qwai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qwai:qwai@postgres:5432/qwai
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
      NEXT_PUBLIC_WS_BASE: ws://localhost:4000
    depends_on: [api]
    ports: ["3000:3000"]

  telegram-bot:
    build: { context: ., dockerfile: apps/telegram-bot/Dockerfile }
    env_file: .env
    environment:
      API_BASE: http://api:4000
    depends_on: [api]

volumes:
  pgdata:
