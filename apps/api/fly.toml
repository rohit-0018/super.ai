app = "qwai-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "run"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "node dist/main.js"
  worker = "node dist/worker.js"
