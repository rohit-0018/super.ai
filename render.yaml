# QWAI — Render deployment manifest.
# One static FE, one Node BE (API + workers + Telegram webhook), managed Postgres, managed Redis.
# Deploy via Render Blueprint. Migrations run from startCommand.
#
# ── First deploy checklist — set these in Render Dashboard → Environment ──────
# REQUIRED (bot will not start without these):
#   TELEGRAM_BOT_TOKEN       Grammy bot token (from @BotFather)
#   ANTHROPIC_API_KEY        From console.anthropic.com → API Keys
#   HELIUS_RPC_URL           https://mainnet.helius-rpc.com/?api-key=YOUR_KEY
#   JWT_SECRET               ≥32 random bytes (auto-generated below)
#   APP_WEB_URL              Your Render web URL, e.g. https://qwai-web-o6jz.onrender.com
#
# TOKEN INTELLIGENCE (enables richer scans — leave blank to disable each):
#   SOLANA_TRACKER_API_KEY   solanatracker.io — top-100 holders, rug risk score
#   MORALIS_API_KEY          moralis.io — pump.fun lifecycle, EVM holders
#   BIRDEYE_API_KEY          birdeye.so — price impact simulation
#   ETHERSCAN_API_KEY        etherscan.io — EVM top-holder lists
#   BITQUERY_API_KEY         bitquery.io — bundle detection, pump.fun trades
#
# TRADING (optional):
#   SOLANA_RPC_URL           Can reuse HELIUS_RPC_URL value or any private RPC
#   JITO_BUNDLE_URL          https://mainnet.block-engine.jito.wtf (default)
#   OPENAI_API_KEY           Alternative to Anthropic — set LLM_PROVIDER=openai
#
# OPTIONAL:
#   TELEGRAM_API_ID / TELEGRAM_API_HASH  From my.telegram.org — gramjs userbot
#   AWS_KMS_KEY_ID / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  Prod key storage
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: super-db
    databaseName: qwai
    user: qwai
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  # ────────────────────────────────────────────────────────────────
  # Managed Redis — BullMQ queues + LLM cache + hot-token store.
  # ────────────────────────────────────────────────────────────────
  - type: redis
    name: super-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ────────────────────────────────────────────────────────────────
  # Backend API — NestJS HTTP server + Telegram webhook handler.
  # BullMQ workers run separately in `super-worker` (QWAI_ROLE=worker).
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: super-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    branch: feat_deployment
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4400
      # web = API + Telegram, no inline workers (handled by super-worker).
      - key: QWAI_ROLE
        value: web

      # ── Network mode ────────────────────────────────────────────
      - key: NETWORK_MODE
        value: mainnet

      # Allow mainnet without AWS KMS — uses JWT_SECRET as the master key.
      # For production-grade wallet security, remove this and set AWS_KMS_KEY_ID.
      - key: ALLOW_UNSAFE_LOCAL_KMS
        value: "1"

      - key: LOG_LEVEL
        value: info

      # ── Infrastructure ───────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: super-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: super-redis
          property: connectionString

      # ── Auth ─────────────────────────────────────────────────────
      - key: WEB_ORIGIN
        value: https://qwai-web-o6jz.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_EXPIRES_IN
        value: 7d

      # ── Telegram ─────────────────────────────────────────────────
      # Bot runs in webhook mode in production (TELEGRAM_WEBHOOK_URL set).
      # No TELEGRAM_BOT_POLL needed — only set that for local dev.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Render service URL — webhook path is appended in code.
      - key: TELEGRAM_API_BASE_URL
        value: https://qwai-api-cirr.onrender.com
      # Public web URL.
      - key: APP_WEB_URL
        value: https://qwai-web-o6jz.onrender.com
      # gramjs userbot (optional — only needed for Telegram group sniping)
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false

      # ── LLM ──────────────────────────────────────────────────────
      # anthropic is recommended. Default is claude-haiku-4-5 for fast (~600ms)
      # token verdicts. Bump to claude-sonnet-4-6 for richer reasoning at ~3x latency.
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      # Haiku responds in <1s; 8s timeout fails fast when Anthropic is degraded
      # so the caller can fall back to playbook-only verdicts instead of hanging.
      - key: LLM_TIMEOUT_MS
        value: "8000"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── Solana RPC ───────────────────────────────────────────────
      # Use Helius — the HELIUS_RPC_URL is also used by the token intelligence
      # providers for holder data. Free tier: helius.dev (10 RPS).
      - key: HELIUS_RPC_URL
        sync: false
      # SOLANA_RPC_URL can be the same as HELIUS_RPC_URL or any private RPC.
      - key: SOLANA_RPC_URL
        sync: false
      - key: JUPITER_API_BASE
        value: https://lite-api.jup.ag/swap/v1
      - key: JITO_BUNDLE_URL
        value: https://mainnet.block-engine.jito.wtf

      # ── Token Intelligence Providers (all optional — leave blank to disable) ──
      # solanatracker.io — top-100 holders, rug risk, pump.fun lifecycle
      - key: SOLANA_TRACKER_API_KEY
        sync: false
      # moralis.io — pump.fun bonding curve, EVM token holders
      - key: MORALIS_API_KEY
        sync: false
      # birdeye.so — price impact simulation ($500/$1K/$5K buy cost)
      - key: BIRDEYE_API_KEY
        sync: false
      # etherscan.io — EVM top-20 holder lists (Ethereum, Base, BSC, etc.)
      - key: ETHERSCAN_API_KEY
        sync: false
      # bitquery.io — bundle detection, pump.fun trade patterns
      - key: BITQUERY_API_KEY
        sync: false

      # ── Hot Token Scanner ────────────────────────────────────────
      - key: HOT_TOKENS_ENABLED
        value: "true"
      - key: HOT_TOKENS_FAST_SCAN
        value: "false"

      # ── Provider toggles ─────────────────────────────────────────
      # archive.org is frequently slow / timing out. Off by default — flip
      # to "true" if you want website history checks back on.
      - key: WAYBACK_ENABLED
        value: "false"

      # ── Intel Track Record ───────────────────────────────────────
      # Controls the periodic re-scan of every captured token. Lower
      # interval = fresher data + more DexScreener calls. Default 10min
      # is fine for free plan (~1k calls/day, well under any limit).
      - key: INTEL_RESCAN_INTERVAL_SEC
        value: "600"
      - key: INTEL_RESCAN_BATCH_SIZE
        value: "60"
      - key: INTEL_RESCAN_MAX_AGE_DAYS
        value: "30"
      # When true, retired/rugged snapshots older than MAX_AGE_DAYS are
      # hard-deleted on every tick. Graduated trophies (10x+) are NEVER
      # auto-purged regardless of this flag.
      - key: INTEL_TRACK_AUTO_PURGE
        value: "false"
      # Minimum AI score to capture a snapshot (snipes + kill-triggers
      # always captured regardless of this floor).
      - key: INTEL_TRACK_CAPTURE_MIN_AI_SCORE
        value: "60"

      # ── Intel Cache Tuning ───────────────────────────────────────
      # In-memory TTL (seconds). 60 = 1 min freshness per request.
      - key: INTEL_CACHE_TTL_SEC
        value: "60"
      # DB cache TTL (seconds). Reports older than this trigger full re-analysis.
      # 600 = 10 min — most repeat scans of trending tokens hit cache and
      # return in <100ms instead of running the full ~2s analysis pipeline.
      - key: INTEL_DB_CACHE_TTL_SEC
        value: "600"

      # ── EVM RPCs (optional) ──────────────────────────────────────
      - key: ETH_RPC_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: ONEINCH_API_KEY
        sync: false

      # ── AWS KMS (optional — remove ALLOW_UNSAFE_LOCAL_KMS if you use this) ──
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_KMS_KEY_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Observability (optional) ─────────────────────────────────
      - key: DATADOG_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

      # Seed demo data only on the very first deploy, then set to false.
      - key: SEED_DB_ON_DEPLOY
        value: "false"

  # ────────────────────────────────────────────────────────────────
  # Background workers — BullMQ consumers, hot-tokens scanner, intel
  # rescan, signal pipeline, position monitor, copy-trade, snipe, DCA,
  # outbound Telegram sends. Runs apps/api/dist/worker.js (no HTTP).
  #
  # JWT_SECRET and TELEGRAM_BOT_TOKEN are mirrored from super-api via
  # `fromService` (must match for KMS fallback + outbound bot calls).
  # Everything else is `sync: false` — set on super-api dashboard, then
  # set on super-worker dashboard for the keys you actually use. Sync
  # works even when optional keys are empty.
  # ────────────────────────────────────────────────────────────────
  - type: worker
    name: super-worker
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    branch: feat_deployment
    buildCommand: ./scripts/render-build.sh
    # No migrations here — super-api owns those. Just boot the worker process.
    startCommand: node --max-old-space-size=400 apps/api/dist/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NODE_ENV
        value: production
      - key: QWAI_ROLE
        value: worker
      - key: LOG_LEVEL
        value: info
      - key: NETWORK_MODE
        value: mainnet
      - key: ALLOW_UNSAFE_LOCAL_KMS
        value: "1"

      # ── Infrastructure (auto-wired) ──────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: super-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: super-redis
          property: connectionString

      # ── Shared secret (mirror from super-api so KMS fallback agrees) ──
      - key: JWT_SECRET
        fromService:
          type: web
          name: super-api
          envVarKey: JWT_SECRET

      # ── Telegram outbound (mirror) ───────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: super-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: APP_WEB_URL
        value: https://qwai-web-o6jz.onrender.com

      # ── LLM (must match super-api so signal-pipeline + /scan agree) ──
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      # Match super-api: 8s fail-fast on degraded Anthropic.
      - key: LLM_TIMEOUT_MS
        value: "8000"
      # Required: at least one of ANTHROPIC_API_KEY / OPENAI_API_KEY must be
      # set on super-api (then it mirrors here). The other can stay empty.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── Solana RPC ───────────────────────────────────────────────
      # HELIUS_RPC_URL is required for Solana scans/trades to function.
      - key: HELIUS_RPC_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: JUPITER_API_BASE
        value: https://lite-api.jup.ag/swap/v1
      - key: JITO_BUNDLE_URL
        value: https://mainnet.block-engine.jito.wtf

      # ── Token Intelligence Providers (all optional — leave empty to disable) ──
      - key: SOLANA_TRACKER_API_KEY
        sync: false
      - key: MORALIS_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: BITQUERY_API_KEY
        sync: false

      # ── Hot Token Scanner (worker owns this now) ─────────────────
      - key: HOT_TOKENS_ENABLED
        value: "true"
      - key: HOT_TOKENS_FAST_SCAN
        value: "false"

      # Mirror the api-side toggle so worker-side scans behave identically.
      - key: WAYBACK_ENABLED
        value: "false"

      # ── Intel Track Record (worker owns this now) ────────────────
      - key: INTEL_RESCAN_INTERVAL_SEC
        value: "600"
      - key: INTEL_RESCAN_BATCH_SIZE
        value: "60"
      - key: INTEL_RESCAN_MAX_AGE_DAYS
        value: "30"
      - key: INTEL_TRACK_AUTO_PURGE
        value: "false"
      - key: INTEL_TRACK_CAPTURE_MIN_AI_SCORE
        value: "60"

      # ── Intel Cache Tuning ───────────────────────────────────────
      - key: INTEL_CACHE_TTL_SEC
        value: "60"
      # Match super-api: 10 min DB cache so repeat scans hit cache instead
      # of running the full pipeline.
      - key: INTEL_DB_CACHE_TTL_SEC
        value: "600"

      # ── EVM RPCs (optional) ──────────────────────────────────────
      - key: ETH_RPC_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: ONEINCH_API_KEY
        sync: false

      # ── AWS KMS (optional — only needed without ALLOW_UNSAFE_LOCAL_KMS) ──
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_KMS_KEY_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Observability (optional) ─────────────────────────────────
      - key: DATADOG_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ────────────────────────────────────────────────────────────────
  # Frontend — Next.js 14 exported to /out, served as a static site.
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: super-web
    runtime: static
    rootDir: .
    branch: feat_deployment
    buildCommand: ./scripts/render-web-build.sh
    staticPublishPath: apps/web/out
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NEXT_PUBLIC_API_BASE
        value: https://qwai-api-cirr.onrender.com/api
      # socket.io-client derives the WS URL from NEXT_PUBLIC_API_BASE
      # by stripping /api — no separate NEXT_PUBLIC_WS_BASE needed.
      - key: NEXT_PUBLIC_NETWORK_MODE
        value: mainnet
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
