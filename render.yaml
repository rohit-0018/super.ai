# QWAI — Render deployment manifest.
# One static FE, one Node BE (API + workers + Telegram webhook), managed Postgres, managed Redis.
# Deploy via Render Blueprint. Migrations run from startCommand (free plan has no preDeploy).
#
# ── First deploy checklist ────────────────────────────────────────────────────
# Set these in the Render dashboard under Environment → Secret Files / Env Vars
# (they have sync: false here so they're never committed to git):
#
#   TELEGRAM_BOT_TOKEN       Grammy bot token (from @BotFather)
#   TELEGRAM_API_ID          From my.telegram.org — needed for gramjs userbot
#   TELEGRAM_API_HASH        From my.telegram.org — needed for gramjs userbot
#   JWT_SECRET               ≥32 random bytes (Render auto-generates if left as generateValue)
#   OPENAI_API_KEY or ANTHROPIC_API_KEY  (set LLM_PROVIDER to match)
#   SOLANA_RPC_URL           Use a private RPC — Helius/Alchemy free tier works fine
#                            e.g. https://mainnet.helius-rpc.com/?api-key=YOUR_KEY
#
# Optional (leave blank to skip the feature):
#   BIRDEYE_API_KEY  COINGECKO_API_KEY  GOPLUS_API_KEY
#   AWS_KMS_KEY_ID   AWS_ACCESS_KEY_ID  AWS_SECRET_ACCESS_KEY  (for prod-grade key storage)
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: qwai-db
    databaseName: qwai
    user: qwai
    plan: free
    postgresMajorVersion: 16

services:
  # ────────────────────────────────────────────────────────────────
  # Managed Redis — BullMQ queues + LLM cache + session nonces.
  # ────────────────────────────────────────────────────────────────
  - type: redis
    name: qwai-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ────────────────────────────────────────────────────────────────
  # Backend — NestJS API + BullMQ workers + Telegram webhook, one process.
  # Workers run inline when QWAI_ROLE=all.
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: qwai-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4400
      - key: QWAI_ROLE
        value: all

      # ── Network mode ────────────────────────────────────────────
      - key: NETWORK_MODE
        value: mainnet

      # Allow mainnet without AWS KMS — uses JWT_SECRET as the master key.
      # Acceptable for a personal bot. Remove this and configure AWS_KMS_KEY_ID
      # if you want production-grade wallet key security.
      - key: ALLOW_UNSAFE_LOCAL_KMS
        value: "1"

      - key: LOG_LEVEL
        value: info

      # ── Infrastructure ───────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: qwai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: qwai-redis
          property: connectionString

      # ── Auth ─────────────────────────────────────────────────────
      - key: WEB_ORIGIN
        value: https://qwai-web.onrender.com
      - key: JWT_SECRET
        generateValue: true

      # ── Telegram ─────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://qwai-api.onrender.com/api/telegram/webhook
      # gramjs userbot — get both from https://my.telegram.org/apps
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false

      # ── LLM ──────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Solana ───────────────────────────────────────────────────
      # Use a private RPC — public mainnet-beta is heavily rate-limited.
      # Free options: Helius (helius.dev), Alchemy (alchemy.com), QuickNode
      - key: SOLANA_RPC_URL
        sync: false
      - key: JUPITER_API_BASE
        value: https://lite-api.jup.ag/swap/v1

      # ── EVM RPCs (optional) ──────────────────────────────────────
      - key: ETH_RPC_URL
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: ONEINCH_API_KEY
        sync: false
      - key: JITO_BUNDLE_URL
        sync: false

      # ── AWS KMS (optional — remove ALLOW_UNSAFE_LOCAL_KMS if you use this) ──
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_KMS_KEY_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Market data (optional) ───────────────────────────────────
      - key: COINGECKO_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
      - key: GOPLUS_API_KEY
        sync: false
      - key: RUGCHECK_API_KEY
        sync: false
      - key: DATADOG_API_KEY
        sync: false

      # Seed demo data only on the very first deploy, then set to false.
      - key: SEED_DB_ON_DEPLOY
        value: "false"

  # ────────────────────────────────────────────────────────────────
  # Frontend — Next.js 14 exported to /out, served as a static site.
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: qwai-web
    runtime: static
    rootDir: .
    buildCommand: ./scripts/render-web-build.sh
    staticPublishPath: apps/web/out
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NEXT_PUBLIC_API_BASE
        value: https://qwai-api.onrender.com/api
      # socket.io-client derives the WS URL from NEXT_PUBLIC_API_BASE
      # by stripping /api — NEXT_PUBLIC_WS_BASE is intentionally omitted.
      - key: NEXT_PUBLIC_NETWORK_MODE
        value: mainnet
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
